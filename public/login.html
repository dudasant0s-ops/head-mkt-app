<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — HEAD MKT</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f7f7f5;--surface:#fff;--border:#e2e2e0;--text:#1a1a1a;--muted:#737373;--accent:#1a1a1a;--red:#dc2626;--radius:8px;--font:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:40px;width:100%;max-width:400px;box-shadow:0 4px 24px rgba(0,0,0,.06)}
.logo{text-align:center;font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:28px}
.logo span{font-weight:400;color:var(--muted)}
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:28px}
.tab{flex:1;text-align:center;padding:10px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s}
.tab.active{color:var(--text);border-bottom-color:var(--accent)}
.form-field{margin-bottom:16px}
.form-field label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:6px}
.form-field input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius);font-size:14px;font-family:var(--font);outline:none;transition:border-color .15s;background:var(--bg)}
.form-field input:focus{border-color:var(--accent)}
.btn-submit{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);font-size:14px;font-weight:600;font-family:var(--font);cursor:pointer;transition:background .15s;margin-top:4px}
.btn-submit:hover{background:#333}
.btn-submit:disabled{opacity:.5;cursor:not-allowed}
.error{background:#fee2e2;color:var(--red);padding:10px 14px;border-radius:var(--radius);font-size:13px;margin-bottom:16px;display:none}
.success{background:#dcfce7;color:#166534;padding:10px 14px;border-radius:var(--radius);font-size:13px;margin-bottom:16px;display:none}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--muted);font-size:12px}
.divider::before,.divider::after{content:'';flex:1;border-top:1px solid var(--border)}
.btn-google{width:100%;padding:11px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);font-size:13px;font-weight:600;font-family:var(--font);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:background .15s}
.btn-google:hover{background:var(--bg)}
.terms{font-size:11px;color:var(--muted);text-align:center;margin-top:16px;line-height:1.6}
.back{display:block;text-align:center;margin-top:20px;font-size:13px;color:var(--muted)}
.back a{color:var(--text);font-weight:600}
</style>
</head>
<body>
<div class="card">
  <div class="logo">HEAD MKT <span>Dashboard</span></div>
  <div class="tabs">
    <div class="tab active" id="tab-login" onclick="switchTab('login')">Entrar</div>
    <div class="tab" id="tab-register" onclick="switchTab('register')">Criar conta</div>
  </div>
  <div id="error-msg" class="error"></div>
  <div id="success-msg" class="success"></div>

  <!-- Login -->
  <div id="form-login">
    <button class="btn-google" onclick="loginGoogle()">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 7.9 2.9l5.7-5.7C34 6.5 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19 13 24 13c3.1 0 5.8 1.1 7.9 2.9l5.7-5.7C34 6.5 29.3 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.3 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8H6.3C9.6 35.6 16.3 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.3 5.6l6.2 5.2C36.9 36.2 44 31 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
      Entrar com Google
    </button>
    <div class="divider">ou</div>
    <div class="form-field"><label>E-mail</label><input id="login-email" type="email" placeholder="seu@email.com" autocomplete="email"></div>
    <div class="form-field"><label>Senha</label><input id="login-pass" type="password" placeholder="••••••••" autocomplete="current-password"></div>
    <button class="btn-submit" id="btn-login" onclick="doLogin()">Entrar</button>
  </div>

  <!-- Register -->
  <div id="form-register" style="display:none">
    <button class="btn-google" onclick="loginGoogle()">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 7.9 2.9l5.7-5.7C34 6.5 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19 13 24 13c3.1 0 5.8 1.1 7.9 2.9l5.7-5.7C34 6.5 29.3 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.3 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8H6.3C9.6 35.6 16.3 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.3 5.6l6.2 5.2C36.9 36.2 44 31 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
      Cadastrar com Google
    </button>
    <div class="divider">ou</div>
    <div class="form-field"><label>Nome</label><input id="reg-name" type="text" placeholder="Seu nome" autocomplete="name"></div>
    <div class="form-field"><label>E-mail</label><input id="reg-email" type="email" placeholder="seu@email.com" autocomplete="email"></div>
    <div class="form-field"><label>Senha</label><input id="reg-pass" type="password" placeholder="Mínimo 8 caracteres" autocomplete="new-password"></div>
    <button class="btn-submit" id="btn-register" onclick="doRegister()">Criar conta</button>
    <div class="terms">Ao criar uma conta você concorda com os Termos de Uso e Política de Privacidade.</div>
  </div>

  <a class="back" href="/index.html">← Voltar ao site</a>
</div>

<script>
const SUPABASE_URL = 'https://bywhpjlwyanredyiqwfl.supabase.co';
const SUPABASE_KEY = 'sb_publishable_eKURyAiCEd75rkn1RuOCHQ_ddnnFTQk';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Check if already logged in
sb.auth.getSession().then(({data:{session}}) => {
  if (session) window.location.href = '/app.html';
});

// Handle register hash
if (window.location.hash === '#register') switchTab('register');

function switchTab(tab) {
  document.getElementById('form-login').style.display = tab==='login' ? 'block' : 'none';
  document.getElementById('form-register').style.display = tab==='register' ? 'block' : 'none';
  document.getElementById('tab-login').classList.toggle('active', tab==='login');
  document.getElementById('tab-register').classList.toggle('active', tab==='register');
  hideMessages();
}

function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg; el.style.display = 'block';
  document.getElementById('success-msg').style.display = 'none';
}
function showSuccess(msg) {
  const el = document.getElementById('success-msg');
  el.textContent = msg; el.style.display = 'block';
  document.getElementById('error-msg').style.display = 'none';
}
function hideMessages() {
  document.getElementById('error-msg').style.display = 'none';
  document.getElementById('success-msg').style.display = 'none';
}

async function loginGoogle() {
  const { error } = await sb.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.origin + '/app.html' }
  });
  if (error) showError(error.message);
}

async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-pass').value;
  if (!email || !pass) return showError('Preencha e-mail e senha.');
  const btn = document.getElementById('btn-login');
  btn.disabled = true; btn.textContent = 'Entrando...';
  const { error } = await sb.auth.signInWithPassword({ email, password: pass });
  if (error) { showError(error.message === 'Invalid login credentials' ? 'E-mail ou senha incorretos.' : error.message); btn.disabled=false; btn.textContent='Entrar'; }
  else window.location.href = '/app.html';
}

async function doRegister() {
  const name = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const pass = document.getElementById('reg-pass').value;
  if (!name || !email || !pass) return showError('Preencha todos os campos.');
  if (pass.length < 8) return showError('A senha precisa ter pelo menos 8 caracteres.');
  const btn = document.getElementById('btn-register');
  btn.disabled = true; btn.textContent = 'Criando conta...';
  const { error } = await sb.auth.signUp({ email, password: pass, options: { data: { name } } });
  if (error) { showError(error.message); btn.disabled=false; btn.textContent='Criar conta'; }
  else showSuccess('Conta criada! Verifique seu e-mail para confirmar e depois entre.');
}

// Enter key
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const loginForm = document.getElementById('form-login');
  if (loginForm.style.display !== 'none') doLogin();
  else doRegister();
});
</script>
</body>
</html>
